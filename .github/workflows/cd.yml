name: CD Pipeline

on:
  push:
    tags: ['phase-*']

permissions:
  contents: read
  packages: write

# Prevents concurrent runs of this workflow, ensuring that only the latest deployment is active
concurrency:
  group: cd-pipeline
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Docker image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/api
        tags: |
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          GIT_REF=${{ github.ref }}
          GIT_TAG=${{ github.ref_name }}
          BUILD_DATE=${{ steps.meta.outputs.build-date }}
    
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Docker image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/frontend
        tags: |
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          GIT_REF=${{ github.ref }}
          GIT_TAG=${{ github.ref_name }}
          BUILD_DATE=${{ steps.meta.outputs.build-date }}

  verify:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull and Inspect Backend Image
      run: |
        docker pull ghcr.io/${{ github.repository }}/api:latest
        docker inspect ghcr.io/${{ github.repository }}/api:latest
    
    - name: Pull and Inspect Frontend Image
      run: |
        docker pull ghcr.io/${{ github.repository }}/frontend:latest
        docker inspect ghcr.io/${{ github.repository }}/frontend:latest

  create-release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        git fetch --tags
        LAST_TAG=$(git describe --tags --abrev=0)
        echo "Last tag: $LAST_TAG"
        CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)")
        echo "Changelog:\n$CHANGELOG"
        echo "::set-output name=changelog::$CHANGELOG"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Automated release for tag ${{ github.ref_name }}.

          Changes since last release:
          ${{ steps.changelog.outputs.changelog }}
      draft: false
      prerelease: false