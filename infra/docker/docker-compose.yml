
services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - PORT=${PORT}
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - ENV=${ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - REDIS_URL=${REDIS_URL}
      - REDIS_MAX_RETRIES=${REDIS_MAX_RETRIES}
      - REDIS_MIN_RETRY_BACKOFF=${REDIS_MIN_RETRY_BACKOFF}
      - REDIS_MAX_RETRY_BACKOFF=${REDIS_MAX_RETRY_BACKOFF}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PORT}/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - 3000:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=shortener_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=shortener
    ports:
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener_user -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 5
  cache:
    image: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3001:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  db_data:
  prometheus_data:
  grafana_data: