apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: shortener

spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/almajd3713/le_epic_shortener/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shortener-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shortener-secrets
                  key: database_url
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
